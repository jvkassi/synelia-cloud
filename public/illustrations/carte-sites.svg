      <stop offset="0" stop-color="#ede7f9"/><stop offset="1" stop-color="#ddd2f4"/>
    </linearGradient>
    <pattern id="c-grille" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(43,27,77,.06)" stroke-width="1"/>
    </pattern>
