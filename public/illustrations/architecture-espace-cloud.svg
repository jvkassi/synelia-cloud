<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" role="img" aria-label="Architecture d'un Espace Cloud : Internet, pare-feu et répartiteur de charge, deux sous-réseaux de machines virtuelles, stockage bloc et objet, et le socle opéré par Synelia sous le périmètre piloté par le client">
  <defs>
    <linearGradient id="a-fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4fc"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="760" height="362" rx="14" fill="url(#a-fond)" stroke="#c8c8d4" stroke-width="1.2"/>

  <text x="34" y="32" font-size="11" font-weight="700" letter-spacing="1.1" fill="#c0297a" font-family="Montserrat,system-ui,sans-serif">ESPACE CLOUD (VDC)</text>

  <!--
    Le périmètre du locataire s'arrête avant le socle : c'est la question posée
    à chaque atelier de cadrage — qui règle quoi. La première version faisait
    déborder le socle dans le cadre, ce qui disait le contraire.
  -->
  <g>
    <rect x="150" y="52" width="576" height="228" rx="12" fill="none" stroke="#9b7fd4" stroke-width="1.4" stroke-dasharray="6 5"/>
    <rect x="166" y="42" width="200" height="20" rx="10" fill="#ede7f9"/>
    <text x="266" y="56" text-anchor="middle" font-size="10" font-weight="700" fill="#4b2882" font-family="'Open Sans',system-ui,sans-serif">périmètre piloté par le client</text>
  </g>

  <g>
    <rect x="30" y="138" width="100" height="60" rx="10" fill="#ffffff" stroke="#c8c8d4" stroke-width="1.4"/>
    <rect x="30" y="138" width="100" height="3.5" rx="1.75" fill="#67677c"/>
    <text x="80" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b1b4d" font-family="Montserrat,system-ui,sans-serif">Internet</text>
    <text x="80" y="181" text-anchor="middle" font-size="10.5" fill="#67677c" font-family="'Open Sans',system-ui,sans-serif">BGP · 2 transits</text>
  </g>
  <g>
    <path d="M130 168H167" fill="none" stroke="#9b7fd4" stroke-width="1.8"/>
    <path d="M166 163.5L174 168L166 172.5Z" fill="#9b7fd4"/>
    
  </g>

  <g>
    <rect x="176" y="124" width="118" height="88" rx="10" fill="#ffffff" stroke="#c8c8d4" stroke-width="1.4"/>
    <rect x="176" y="124" width="118" height="3.5" rx="1.75" fill="#4b2882"/>
    <text x="235" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b1b4d" font-family="Montserrat,system-ui,sans-serif">Pare-feu</text>
    <text x="235" y="181" text-anchor="middle" font-size="10.5" fill="#67677c" font-family="'Open Sans',system-ui,sans-serif">WAF · anti-DDoS</text>
  </g>
  <g>
    <path d="M294 168H329" fill="none" stroke="#9b7fd4" stroke-width="1.8"/>
    <path d="M328 163.5L336 168L328 172.5Z" fill="#9b7fd4"/>
    
  </g>

  <g>
    <rect x="338" y="124" width="118" height="88" rx="10" fill="#ffffff" stroke="#c8c8d4" stroke-width="1.4"/>
    <rect x="338" y="124" width="118" height="3.5" rx="1.75" fill="#6b3fa0"/>
    <text x="397" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b1b4d" font-family="Montserrat,system-ui,sans-serif">Répartiteur</text>
    <text x="397" y="181" text-anchor="middle" font-size="10.5" fill="#67677c" font-family="'Open Sans',system-ui,sans-serif">2 chemins</text>
  </g>

  <!-- Le sous-réseau public expose ; le privé ne sort que par le répartiteur. -->
  <g>
    <rect x="500" y="74" width="200" height="58" rx="10" fill="#ffffff" stroke="#c8c8d4" stroke-width="1.4"/>
    <rect x="500" y="74" width="200" height="3.5" rx="1.75" fill="#6b3fa0"/>
    <text x="600" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b1b4d" font-family="Montserrat,system-ui,sans-serif">Sous-réseau public</text>
    <text x="600" y="116" text-anchor="middle" font-size="10.5" fill="#67677c" font-family="'Open Sans',system-ui,sans-serif">2 VM · web</text>
  </g>
  <g>
    <rect x="500" y="144" width="200" height="58" rx="10" fill="#ffffff" stroke="#c8c8d4" stroke-width="1.4"/>
    <rect x="500" y="144" width="200" height="3.5" rx="1.75" fill="#3a2266"/>
    <text x="600" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b1b4d" font-family="Montserrat,system-ui,sans-serif">Sous-réseau privé</text>
    <text x="600" y="186" text-anchor="middle" font-size="10.5" fill="#67677c" font-family="'Open Sans',system-ui,sans-serif">3 VM · applicatif et base</text>
  </g>

  <path d="M456 152H478V103H494" fill="none" stroke="#9b7fd4" stroke-width="1.8"/>
  <path d="M486 98.5L494 103L486 107.5Z" fill="#9b7fd4"/>
  <path d="M456 184H478V173H494" fill="none" stroke="#9b7fd4" stroke-width="1.8"/>
  <path d="M486 168.5L494 173L486 177.5Z" fill="#9b7fd4"/>

  <g>
    <rect x="500" y="214" width="96" height="52" rx="10" fill="#ffffff" stroke="#c8c8d4" stroke-width="1.4"/>
    <rect x="500" y="214" width="96" height="3.5" rx="1.75" fill="#c0297a"/>
    <text x="548" y="237" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b1b4d" font-family="Montserrat,system-ui,sans-serif">Bloc</text>
    <text x="548" y="253" text-anchor="middle" font-size="10.5" fill="#67677c" font-family="'Open Sans',system-ui,sans-serif">NVMe</text>
  </g>
  <g>
    <rect x="604" y="214" width="96" height="52" rx="10" fill="#ffffff" stroke="#c8c8d4" stroke-width="1.4"/>
    <rect x="604" y="214" width="96" height="3.5" rx="1.75" fill="#c0297a"/>
    <text x="652" y="237" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b1b4d" font-family="Montserrat,system-ui,sans-serif">Objet</text>
    <text x="652" y="253" text-anchor="middle" font-size="10.5" fill="#67677c" font-family="'Open Sans',system-ui,sans-serif">S3</text>
  </g>
  <path d="M548 202V214M652 202V214" fill="none" stroke="#9b7fd4" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- Sous le périmètre : ce que nous opérons, et que le client ne règle pas. -->
  <g>
    <rect x="30" y="296" width="696" height="46" rx="10" fill="#2b1b4d"/>
    <text x="50" y="316" font-size="11.5" font-weight="700" fill="#ffffff" font-family="Montserrat,system-ui,sans-serif">Socle opéré par Synelia</text>
    <text x="50" y="332" font-size="10.5" fill="#c9b6f5" font-family="'Open Sans',system-ui,sans-serif">hyperviseurs, réseau physique, stockage, supervision, sauvegarde — hors du périmètre client</text>
  </g>
</svg>
