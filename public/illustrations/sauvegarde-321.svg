    <text x="560" y="146" text-anchor="middle" font-size="10.5" fill="#67677c" font-family="'Open Sans',system-ui,sans-serif">Objet S3 · VITIB (GBM)</text>
  </g>
  <g><rect x="364" y="150" width="54" height="17" rx="8.5" fill="#ede7f9"/>
      <text x="391" y="162" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4b2882" font-family="'Open Sans',system-ui,sans-serif">copie 1</text></g><g><rect x="582" y="150" width="54" height="17" rx="8.5" fill="#ede7f9"/>
      <text x="609" y="162" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4b2882" font-family="'Open Sans',system-ui,sans-serif">copie 2</text></g>

  <g>
