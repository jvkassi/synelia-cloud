  <g>
    <rect x="40" y="212" width="404" height="64" rx="10" fill="#ffffff" stroke="#c8c8d4" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="58" y="233" font-size="11.5" font-weight="700" fill="#2b1b4d" font-family="Montserrat,system-ui,sans-serif">Ce que le schéma ne promet pas</text>
