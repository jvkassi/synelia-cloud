    <text x="342" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b1b4d" font-family="Montserrat,system-ui,sans-serif">Instantané local</text>
    <text x="342" y="146" text-anchor="middle" font-size="10.5" fill="#67677c" font-family="'Open Sans',system-ui,sans-serif">NVMe · Vallon (ABJ)</text>
  </g><g>
    <rect x="476" y="96" width="168" height="74" rx="10" fill="#ffffff" stroke="#c8c8d4" stroke-width="1.4"/>
