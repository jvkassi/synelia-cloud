  </defs>
  <rect width="760" height="306" rx="14" fill="url(#v-cadre)" stroke="#c8c8d4" stroke-width="1.2"/>

  <text x="40" y="38" font-size="11" font-weight="700" letter-spacing="1.1" fill="#c0297a" font-family="Montserrat,system-ui,sans-serif">RÈGLE 3-2-1</text>
  <text x="40" y="62" font-size="15" font-weight="700" fill="#2b1b4d" font-family="Montserrat,system-ui,sans-serif">Trois copies, deux supports, une hors site</text>

